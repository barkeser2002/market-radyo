name: Auto release

# Surum ve yayin otomasyonu (insan onayi beklenmez).
#
# Job'lar:
# - merge-dependabot: HER calismada (workflow_run, schedule, push, elle) tum acik
#   dependabot[bot] PR'larini tarar. Lint'i basarili olanlari squash ile birlestirir;
#   Lint basarisiz/yok ve PR main'in gerisindeyse "@dependabot rebase" yorumu, mergeable
#   CONFLICTING ise "@dependabot recreate" yorumu birakir. Bu job "release" concurrency
#   grubunda DEGIL: bekleyen run'lar birbirini iptal etmesin diye her run kendi grubunda.
# - bump (needs: merge-dependabot): exe'yi etkileyen (.github/ disi) bir birlestirme
#   varsa ya da run workflow_run degilse surum artirilir ve commit/etiket atilir.
#   Yalnizca .github/ degisen birlesmelerde bu job atlanir.
# - release: release.yml'yi workflow_call ile cagirarak yayinlar.
# - rollback: yayin basarisizsa etiket ve GitHub Release silinir; birlestirilen
#   dependabot commit'leri git revert ile geri alinir.
#
# Tetikleyiciler:
# - workflow_run: "Lint" tamamlandiginda (sweep yapilir).
# - schedule (her saat): son etiketten bu yana exe'yi etkileyen degisiklik varsa surum
#   artirilip yayinlanir. Saat 03 (UTC) calismasinda ayrica yt-dlp son surumu denenir.
# - push (main, yalnizca version.txt): elle yazilmis yeni surum yayinlanir.
# - workflow_dispatch: elle calistirma (yt-dlp kontrolu dahil).
#
# Yayin release.yml'yi workflow_call ile cagirarak yapilir; GITHUB_TOKEN ile itilen
# etiket/commit baska workflow'lari tetiklemez.

on:
  workflow_run:
    workflows: ["Lint"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths: [version.txt]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-dependabot:
    name: Dependabot PR'lerini tara ve birlestir
    # Release grubunda degil; her run kendi grubunda (sirada bekleyen iptal olmaz).
    concurrency:
      group: merge-${{ github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      go: ${{ steps.sweep.outputs.go }}
      dependabot: ${{ steps.sweep.outputs.dependabot }}
      merge_shas: ${{ steps.sweep.outputs.merge_shas }}
      titles: ${{ steps.sweep.outputs.titles }}
    steps:
      - name: Acik dependabot PR'larini tara ve birlestir
        id: sweep
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          NOW=$(date -u +%s)
          THROTTLE=21600 # 6 saat

          # Son 6 saatte bu PR'a @dependabot rebase/recreate yazildi mi?
          recently_asked() {
            local n=$1 last t
            last=$(gh api --paginate "repos/$REPO/issues/$n/comments" \
              --jq '.[] | select(.body | test("^@dependabot (rebase|recreate)")) | .created_at' \
              | sort | tail -n 1)
            [ -n "$last" ] || return 1
            t=$(date -u -d "$last" +%s)
            [ $(( NOW - t )) -lt "$THROTTLE" ]
          }

          # Head sha'daki Lint run'i: success | failure | none | pending
          lint_state() {
            gh api "repos/$REPO/actions/workflows/lint.yml/runs?head_sha=$1&per_page=10" \
              --jq 'if (.workflow_runs | length) == 0 then "none"
                    else (.workflow_runs | sort_by(.created_at) | last) as $r
                    | if $r.status != "completed" then "pending"
                      elif $r.conclusion == "success" then "success"
                      else "failure" end end' 2>/dev/null || echo "pending"
          }

          GO=false
          DEP=false
          EXE_SHAS=""
          TITLES=""
          # Zamanlanmis / elle / push calismada surum kontrolu her zaman yapilir.
          if [ "$EVENT" != "workflow_run" ]; then GO=true; fi

          gh pr list --repo "$REPO" --author app/dependabot --state open --limit 100 \
            --json number,headRefOid,mergeable,mergeStateStatus,title \
            --jq '.[] | [.number, .headRefOid, .mergeable, .mergeStateStatus, .title] | @tsv' \
            | sort -n > "$RUNNER_TEMP/dependabot-prs.tsv"

          while IFS=$'\t' read -r N SHA MERGEABLE STATE TITLE; do
            [ -n "$N" ] || continue
            echo "--- PR #$N (mergeable=$MERGEABLE, durum=$STATE)"

            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              if recently_asked "$N"; then
                echo "#$N: yakin zamanda rebase/recreate istendi; atlaniyor."
              else
                gh pr comment "$N" --repo "$REPO" --body "@dependabot recreate" \
                  && echo "#$N: recreate istendi."
              fi
              continue
            fi
            if [ "$MERGEABLE" != "MERGEABLE" ]; then
              echo "#$N: mergeable belirsiz; atlaniyor."
              continue
            fi

            LINT=$(lint_state "$SHA")
            echo "#$N: Lint ($SHA) = $LINT"

            if [ "$LINT" = "pending" ]; then
              echo "#$N: Lint calisiyor; atlaniyor."
              continue
            fi

            if [ "$LINT" = "success" ]; then
              FILES=$(gh api --paginate "repos/$REPO/pulls/$N/files" --jq '.[].filename') || {
                echo "#$N: dosya listesi alinamadi; atlaniyor."
                continue
              }
              EXE=false
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                case "$f" in
                  .github/*) ;;
                  *) EXE=true ;;
                esac
              done <<< "$FILES"

              if gh pr merge "$N" --repo "$REPO" --squash --delete-branch; then
                echo "#$N birlestirildi (exe etkileyen: $EXE)."
                if [ "$EXE" = true ]; then
                  MSHA=$(gh api "repos/$REPO/pulls/$N" --jq '.merge_commit_sha')
                  EXE_SHAS="${EXE_SHAS:+$EXE_SHAS }$MSHA"
                  TITLES="${TITLES}- ${TITLE}"$'\n'
                  DEP=true
                  GO=true
                fi
              else
                echo "#$N birlestirilemedi."
                if [ "$STATE" = "BEHIND" ] && ! recently_asked "$N"; then
                  gh pr comment "$N" --repo "$REPO" --body "@dependabot rebase" \
                    && echo "#$N: rebase istendi."
                fi
              fi
              continue
            fi

            # Lint basarisiz ya da hic calismamis (eski): main'in gerisindeyse rebase iste.
            if [ "$STATE" = "BEHIND" ]; then
              if recently_asked "$N"; then
                echo "#$N: yakin zamanda rebase/recreate istendi; atlaniyor."
              else
                gh pr comment "$N" --repo "$REPO" --body "@dependabot rebase" \
                  && echo "#$N: rebase istendi."
              fi
            else
              echo "#$N: Lint $LINT, main'in gerisinde degil; atlaniyor."
            fi
          done < "$RUNNER_TEMP/dependabot-prs.tsv"

          {
            echo "go=$GO"
            echo "dependabot=$DEP"
            echo "merge_shas=$EXE_SHAS"
            echo "titles<<TITLES_EOF"
            printf '%s\n' "${TITLES%$'\n'}"
            echo "TITLES_EOF"
          } >> "$GITHUB_OUTPUT"

  bump:
    name: Surum artir
    needs: merge-dependabot
    if: needs.merge-dependabot.outputs.go == 'true'
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      dependabot: ${{ needs.merge-dependabot.outputs.dependabot }}
      merge_shas: ${{ needs.merge-dependabot.outputs.merge_shas }}
      bump_sha: ${{ steps.publish.outputs.bump_sha }}
      notes: ${{ steps.publish.outputs.notes }}
    steps:
      - name: Main'i al
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: yt-dlp denetle (saat 03 UTC ve elle calistirmada)
        id: ytdlp
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%H)" != "03" ]; then
            echo "Saat 03 (UTC) degil; yt-dlp kontrolu atlaniyor."
            exit 0
          fi
          cat > "$RUNNER_TEMP/ytdlp.py" <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path

          def nums(v):
              return tuple(int(x) for x in re.findall(r"\d+", v))

          req = Path("requirements.txt")
          text = req.read_text(encoding="utf-8")
          m = re.search(r"^yt-dlp[ \t]*(?:(?:==|>=)[ \t]*([^\s;#]+))?[ \t]*(?:#.*)?$", text, re.M)
          if m is None:
              raise SystemExit("requirements.txt icinde yt-dlp satiri yok")
          current = m.group(1)
          latest = json.load(urllib.request.urlopen(
              "https://pypi.org/pypi/yt-dlp/json", timeout=30))["info"]["version"]
          if current and nums(current) >= nums(latest):
              print("yt-dlp guncel: %s" % current)
              raise SystemExit(0)
          req.write_text(text[:m.start()] + "yt-dlp==" + latest + text[m.end():], encoding="utf-8")
          print("yt-dlp %s -> %s" % (current or "sabitlenmemis", latest))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as f:
              f.write("version=%s\n" % latest)
          PY
          python "$RUNNER_TEMP/ytdlp.py"

      - name: Surum belirle
        id: version
        shell: bash
        env:
          YTDLP: ${{ steps.ytdlp.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet origin
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          CHANGED=false
          if [ -z "$LAST" ] || [ -n "$YTDLP" ]; then
            CHANGED=true
          elif [ -n "$(git diff --name-only "$LAST" HEAD -- '*.py' 'requirements*.txt' 'MarketRadyo.spec' 'data/playlists.json')" ]; then
            CHANGED=true
          fi
          if [ "$CHANGED" != true ]; then
            echo "Son etiket ($LAST) sonrasinda exe'yi etkileyen degisiklik yok; surum artirilmadi."
            exit 0
          fi
          export LAST_TAG="$LAST"
          cat > "$RUNNER_TEMP/version.py" <<'PY'
          import os, re, subprocess
          from pathlib import Path

          def nums(v):
              return tuple(int(x) for x in re.findall(r"\d+", v))

          last = os.environ.get("LAST_TAG", "").lstrip("v")
          cur = Path("version.txt").read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", cur):
              raise SystemExit("version.txt gecersiz: %r" % cur)

          if (not last) or nums(cur) > nums(last):
              # version.txt son etiketten ileride: elle yazilan surum kullanilir.
              major, minor, patch = nums(cur)
          else:
              # Aksi halde son surumun patch'i bir artirilir.
              major, minor, patch = max(nums(cur), nums(last))
              patch += 1

          def tag_on_remote(tag):
              r = subprocess.run(["git", "ls-remote", "--exit-code", "--tags", "origin",
                                  "refs/tags/" + tag], capture_output=True)
              return r.returncode == 0

          while tag_on_remote("v%d.%d.%d" % (major, minor, patch)):
              patch += 1
          version = "%d.%d.%d" % (major, minor, patch)
          Path("version.txt").write_text(version + "\n", encoding="utf-8")
          print("yeni surum: %s (son etiket: %s)" % (version, last or "yok"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as f:
              f.write("version=%s\n" % version)
              f.write("tag=v%s\n" % version)
          PY
          python "$RUNNER_TEMP/version.py"

      - name: Commit, etiket, push ve yayin notu
        id: publish
        if: steps.version.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          YTDLP: ${{ steps.ytdlp.outputs.version }}
          DEPENDABOT: ${{ needs.merge-dependabot.outputs.dependabot }}
          PR_TITLE: ${{ needs.merge-dependabot.outputs.titles }}
        run: |
          set -euo pipefail
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)

          # Yayin notu: dependabot ise birlesen PR basliklari, degilse son etiketten beri commit listesi.
          if [ "$DEPENDABOT" = "true" ]; then
            NOTES="$PR_TITLE"
          else
            if [ -n "$LAST" ]; then RANGE="$LAST..HEAD"; else RANGE="HEAD"; fi
            NOTES=$(git log --no-merges --pretty=format:'- %s' "$RANGE" 2>/dev/null | head -n 60 || true)
            [ -n "$NOTES" ] || NOTES="- Surum guncellemesi"
          fi
          if [ -n "$YTDLP" ]; then NOTES="$NOTES"$'\n'"- yt-dlp $YTDLP"; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt requirements.txt

          COMMITTED=false
          if ! git diff --cached --quiet; then
            printf 'chore: release %s [skip ci]\n\nCo-Authored-By: Claude Haiku 5.5 <noreply@anthropic.com>\n' "$TAG" > "$RUNNER_TEMP/commit-msg.txt"
            git commit -q -F "$RUNNER_TEMP/commit-msg.txt"
            COMMITTED=true
          fi

          # Etiket, rebase'den sonra (main'in son hali uzerinde) atilir.
          git pull --rebase --quiet origin main
          git tag -a "$TAG" -m "Surum $TAG"

          BUMP_SHA=""
          if [ "$COMMITTED" = true ]; then
            git push origin HEAD:main
            BUMP_SHA=$(git rev-parse HEAD)
          fi
          git push origin "refs/tags/$TAG"

          {
            echo "bump_sha=$BUMP_SHA"
            echo "notes<<NOTES_EOF"
            printf '%s\n' "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Yayinla
    needs: bump
    if: needs.bump.outputs.tag != ''
    concurrency:
      group: release
      cancel-in-progress: false
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.bump.outputs.version }}
      notes: ${{ needs.bump.outputs.notes }}

  rollback:
    name: Yayin basarisizsa geri al
    needs: [bump, release]
    if: always() && needs.release.result == 'failure'
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Main'i al
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Etiketi ve yayini sil, dependabot birlesmelerini geri al
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.bump.outputs.tag }}
          DEPENDABOT: ${{ needs.bump.outputs.dependabot }}
          MERGE_SHAS: ${{ needs.bump.outputs.merge_shas }}
          BUMP_SHA: ${{ needs.bump.outputs.bump_sha }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag || true
          git push origin ":refs/tags/$TAG" || true
          if [ "$DEPENDABOT" = "true" ] && [ -n "$MERGE_SHAS" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ -n "$BUMP_SHA" ]; then git revert --no-edit "$BUMP_SHA"; fi
            # Birlesmeleri ters sirada geri al (en yeni once).
            read -ra SHAS <<< "$MERGE_SHAS"
            for ((i=${#SHAS[@]}-1; i>=0; i--)); do
              git revert --no-edit "${SHAS[i]}"
            done
            git push origin HEAD:main
          else
            echo "Geri alinacak dependabot birlesmesi yok; commit'ler yerinde birakildi."
          fi
