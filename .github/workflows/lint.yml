name: Lint

# Her pull request ve main'e push'ta calisir. Basarili bitisi auto-release.yml'yi
# (dependabot PR birlestirme) tetikler; bu yuzden isim "Lint" olarak sabit kalmali.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint ve testler (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Bagimliliklari kur (ruff dahil)
        run: python -m pip install -r requirements-dev.txt

      - name: ffmpeg indir (testler icin)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg-extract'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $found = Get-ChildItem -Path $dir -Filter ffmpeg.exe -Recurse |
            Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          if (-not $found) { throw 'ffmpeg.exe arsivde bulunamadi' }
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item -Path $found.FullName -Destination 'bin\ffmpeg.exe' -Force
          & .\bin\ffmpeg.exe -version | Select-Object -First 1

      - name: ruff (yalnizca gercek hatalar)
        run: python -m ruff check .

      - name: Birim testleri
        run: python -m unittest discover -s tests -v
