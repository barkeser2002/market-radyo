name: Release

# Tek sorumluluk: verilen surumu derleyip GitHub Release olarak yayinlamak.
# - workflow_call: auto-release.yml bu dosyayi cagirir. GITHUB_TOKEN ile itilen etiket
#   baska bir push run'i baslatmadigi icin push/tag tetikleyicisi kullanilmaz.
# - workflow_dispatch: Actions sekmesinden elle yeniden yayin (v<surum> etiketi repoda olmali).

on:
  workflow_call:
    inputs:
      version:
        description: "Surum (ornek 2.0.1, basinda v olmadan). Etiket v<surum> repoda olmali."
        required: true
        type: string
      notes:
        description: "Yayin notu (duz metin)."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Surum (ornek 2.0.1, basinda v olmadan). Etiket v<surum> repoda olmali."
        required: true
        type: string
      notes:
        description: "Yayin notu (duz metin)."
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Derle, dogrula ve yayinla
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Surumu dogrula
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Gecersiz surum: '$VERSION' (beklenen X.Y.Z)"
            exit 1
          fi

      - name: Etiketli kodu al
        uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: ffmpeg indir (bin/)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg-extract'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $found = Get-ChildItem -Path $dir -Filter ffmpeg.exe -Recurse |
            Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          if (-not $found) { throw 'ffmpeg.exe arsivde bulunamadi' }
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item -Path $found.FullName -Destination 'bin\ffmpeg.exe' -Force
          & .\bin\ffmpeg.exe -version | Select-Object -First 1

      - name: Bagimliliklari kur
        run: python -m pip install -r requirements-dev.txt

      - name: Birim testleri
        run: python -m unittest discover -s tests -v

      - name: Surum dosyasini girdiden yaz
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: printf '%s\n' "$VERSION" > version.txt

      - name: Derle (PyInstaller)
        run: python -m PyInstaller MarketRadyo.spec --noconfirm --clean

      - name: Duman testi (20 sn ayakta mi, log temiz mi)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $exe = Join-Path $root 'dist\MarketRadyo.exe'
          if (-not (Test-Path $exe)) { throw 'dist\MarketRadyo.exe uretilmedi' }
          $workDir = Join-Path $root 'dist'
          $stdout = Join-Path $env:RUNNER_TEMP 'smoke-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'smoke-stderr.txt'
          $p = Start-Process -FilePath $exe -WorkingDirectory $workDir -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 20
          $p.Refresh()
          $alive = -not $p.HasExited
          $exitCode = if ($alive) { $null } else { $p.ExitCode }
          if ($alive) { Stop-Process -Id $p.Id -Force }
          Start-Sleep -Seconds 2

          $problems = @()
          if (-not $alive) { $problems += "surec 20 sn icinde kapandi (cikis kodu $exitCode)" }
          $logFile = Join-Path $workDir 'data\radyo.log'
          if (-not (Test-Path $logFile)) { $problems += 'data\radyo.log olusmadi' }
          $text = ''
          foreach ($f in @($logFile, $stdout, $stderr)) {
            if (Test-Path $f) { $text += (Get-Content -Path $f -Raw -Encoding UTF8) + "`n" }
          }
          # main.py biçimi: "%(asctime)s %(levelname)s %(name)s: %(message)s"
          # Yalnizca seviye alani ERROR/CRITICAL olan satirlar hata sayilir (WARNING asla).
          # -cmatch: buyuk/kucuk harf duyarli.
          $errLine = '(?m)^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} (ERROR|CRITICAL) '
          $traceback = 'Traceback \(most recent call last\)'
          if (($text -cmatch $errLine) -or ($text -cmatch $traceback)) {
            $problems += 'log/stdout/stderr icinde ERROR/CRITICAL satiri veya Traceback var'
            if (Test-Path $logFile) {
              Write-Host '--- radyo.log (son 80 satir) ---'
              Get-Content -Path $logFile -Encoding UTF8 | Select-Object -Last 80
            }
          }
          if ($problems.Count -gt 0) { throw ('Duman testi basarisiz: ' + ($problems -join '; ')) }
          Write-Host 'Duman testi gecti.'

      - name: SHA256 uret
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hash = (Get-FileHash -Algorithm SHA256 -Path 'dist\MarketRadyo.exe').Hash.ToLower()
          Set-Content -Path 'dist\MarketRadyo.exe.sha256' -Value "$hash  MarketRadyo.exe" -Encoding ascii
          Get-Content 'dist\MarketRadyo.exe.sha256'

      - name: Yayin olustur ve dosyalari yukle
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ inputs.version }}
          name: Market Radyo v${{ inputs.version }}
          body: ${{ inputs.notes }}
          fail_on_unmatched_files: true
          files: |
            dist/MarketRadyo.exe
            dist/MarketRadyo.exe.sha256
